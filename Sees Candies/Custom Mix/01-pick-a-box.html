<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Custom Mix — Step 1: Pick a Box</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    /* Zoom modal */
    .zoom-modal-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: var(--color-bg-alt); border-radius: var(--radius-md); margin-bottom: var(--s-16); display: block; }
    .zoom-modal-name { font-family: var(--font-display); font-size: var(--fs-24); margin: 0 0 var(--s-4); }
    .zoom-modal-price { font-size: var(--fs-18); font-weight: 600; margin: 0 0 var(--s-8); }
    .zoom-modal-meta { font-size: var(--fs-14); color: var(--color-fg-muted); margin: 0 0 var(--s-24); line-height: 1.5; }

    /* Store picker */
    .store-item { display: flex; align-items: center; justify-content: space-between; padding: var(--s-16) 0; border-bottom: 1px solid var(--color-border); cursor: pointer; }
    .store-item:last-child { border-bottom: 0; }
    .store-item__name { font-weight: 600; font-size: var(--fs-15); }
    .store-item__addr { font-size: var(--fs-13); color: var(--color-fg-muted); margin-top: 2px; }
    .store-item__arrow { color: var(--color-fg-muted); font-size: var(--fs-18); }

    /* Downsize modal */
    .ds-flavor-row { display: flex; align-items: center; gap: var(--s-8); padding: 12px 0; border-bottom: 1px solid var(--color-border); }
    .ds-flavor-row:last-child { border-bottom: 0; }
    .ds-flavor-name { flex: 1; font-size: var(--fs-14); }
    .ds-remove-btn { background: none; border: 0; font-size: var(--fs-13); color: var(--color-fg-muted); cursor: pointer; text-decoration: underline; padding: 0; min-height: 44px; }

    /* Single-size static display */
    .size-static { margin: 0 var(--s-16) var(--s-16); padding: var(--s-12); border: 2px solid var(--color-border-strong); font-size: var(--fs-15); font-weight: 700; display: flex; align-items: center; gap: var(--s-8); }

    /* Summary expanded */
    .bar-expanded { padding: var(--s-12) var(--s-16); border-top: 1px solid var(--color-border); font-size: var(--fs-13); }
    .bar-expanded__row { display: flex; justify-content: space-between; padding: var(--s-6) 0; }

    /* Fulfillment */
    .fulfillment-wrap { padding: 0 var(--s-16) var(--s-16); }
    .pickup-info { margin-top: var(--s-8); font-size: var(--fs-13); color: var(--color-fg-muted); display: flex; align-items: center; gap: var(--s-8); }
  </style>
</head>

function BottomSheet({ open, onClose, children }) {
  React.useEffect(() => {
    document.body.style.overflow = open ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);
  if (!open) return null;
  return (
    <div className="scrim" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet" role="dialog" aria-modal="true">{children}</div>
    </div>
  );
}

function ProgressBar({ pct, style, gold }) {
  return (
    <div className="progress" style={style}>
      <div className="progress__fill" style={{
        width: `${Math.min(100, Math.max(0, pct))}%`,
        background: gold ? 'var(--color-progress-fill)' : undefined
      }} />
    </div>
  );
}

function PercentStepper({ value, onDecrement, onIncrement, minVal = 1 }) {
  return (
    <div className="stepper" onClick={(e) => e.stopPropagation()}>
      <button className="stepper__btn" onClick={onDecrement} disabled={value <= minVal}>−</button>
      <span className="stepper__val">{value}%</span>
      <button className="stepper__btn" onClick={onIncrement} disabled={value >= 99}>+</button>
    </div>
  );
}

// ─── Screen-specific code ─────────────────────────────────────────────────────

const { useState } = React;
const D = window.SEES_DATA;
const S = window.SeesState;

// ─── Downsize Conflict Modal ──────────────────────────────────────────────────
function DownsizeModal({ targetSizeId, flavors, onSwitch, onCancel }) {
  const [local, setLocal] = useState([...flavors]);
  const targetSize = D.findSize(targetSizeId);
  const cap = targetSize?.cap || 0;
  const overCount = local.length - cap;

  return (
    <BottomSheet open={true} onClose={onCancel}>
      <div className="sheet__handle" />
      <div style={{ position: 'relative' }}>
        <button className="sheet__close" onClick={onCancel}>✕</button>
        <h2 className="sheet__title">Too many flavors for this box</h2>
      </div>
      <p style={{ fontSize: 'var(--fs-14)', color: 'var(--color-fg-muted)', marginBottom: 'var(--s-16)' }}>
        The {targetSize?.label} box holds up to {cap} flavors.
        {overCount > 0
          ? <strong> Remove {overCount} flavor{overCount !== 1 ? 's' : ''} to switch.</strong>
          : <span> You're ready to switch!</span>
        }
      </p>
      <div style={{ marginBottom: 'var(--s-20)' }}>
        {local.map(f => {
          const flavor = D.findFlavor(f.id);
          return (
            <div key={f.id} className="ds-flavor-row">
              <span className="ds-flavor-name">{flavor?.name}</span>
              <button className="ds-remove-btn" onClick={() => setLocal(prev => prev.filter(x => x.id !== f.id))}>
                Remove
              </button>
            </div>
          );
        })}
      </div>
      <button
        className="btn"
        disabled={local.length > cap}
        style={{ marginBottom: 'var(--s-8)' }}
        onClick={() => onSwitch(S.rebalanceEqual(local))}
      >
        Switch to {targetSize?.label}
      </button>
      <button className="btn btn--secondary" onClick={onCancel}>Keep Current Box</button>
    </BottomSheet>
  );
}

// ─── Box Zoom Modal ───────────────────────────────────────────────────────────
function BoxZoomModal({ styleId, sizeId, onClose, onSelectAndContinue }) {
  const style = D.findStyle(styleId);
  const size  = D.findSize(sizeId);

  return (
    <BottomSheet open={true} onClose={onClose}>
      <div className="sheet__handle" />
      <div style={{ position: 'relative' }}>
        <button className="sheet__close" onClick={onClose}>✕</button>
      </div>
      <img className="zoom-modal-img" src={style?.image} alt={style?.name} />
      <p className="zoom-modal-name">{style?.name}</p>
      <p className="zoom-modal-price">${size?.price.toFixed(2)}</p>
      <p className="zoom-modal-meta">Holds up to {size?.cap} flavors · Perfect for gifting or yourself.</p>
      <button className="btn" onClick={onSelectAndContinue}>
        Start from this mix · ${size?.price.toFixed(2)}
      </button>
    </BottomSheet>
  );
}

// ─── Store Picker Modal ───────────────────────────────────────────────────────
function StorePickerModal({ onSelect, onClose }) {
  return (
    <BottomSheet open={true} onClose={onClose}>
      <div className="sheet__handle" />
      <div style={{ position: 'relative' }}>
        <button className="sheet__close" onClick={onClose}>✕</button>
        <h2 className="sheet__title">Choose a Store</h2>
      </div>
      {D.stores.map(store => (
        <div key={store.id} className="store-item" onClick={() => { onSelect(store.id); onClose(); }}>
          <div>
            <div className="store-item__name">{store.name}</div>
            <div className="store-item__addr">{store.address}</div>
          </div>
          <span className="store-item__arrow">›</span>
        </div>
      ))}
    </BottomSheet>
  );
}

// ─── Summary Bar ─────────────────────────────────────────────────────────────
function SummaryBar({ state, expanded, onToggle, onNext }) {
  const style  = D.findStyle(state.boxStyleId);
  const size   = D.findSize(state.boxSizeId);
  const design = D.findDesign(state.boxDesignId);
  const caption = [style?.name, size?.label, state.fulfillment === 'shipping' ? 'Shipping' : 'Pick Up'].filter(Boolean).join(' · ');

  return (
    <div className="bottom-bar">
      {expanded && (
        <div className="bar-expanded">
          <div className="bar-expanded__row">
            <span>{size?.label} {style?.name}</span>
            <span style={{ fontWeight: 600 }}>${size?.price.toFixed(2)}</span>
          </div>
          {design?.upcharge > 0 && (
            <div className="bar-expanded__row">
              <span>{design.name} design</span>
              <span>+${design.upcharge.toFixed(2)}</span>
            </div>
          )}
          <div className="divider" style={{ margin: 'var(--s-8) 0' }} />
          <div className="bar-expanded__row" style={{ fontWeight: 700 }}>
            <span>Subtotal</span>
            <span>${S.subtotal(state).toFixed(2)}</span>
          </div>
        </div>
      )}
      <div className="bottom-bar__summary">
        <div className="bottom-bar__left">
          <p className="bottom-bar__step">Step 1 of 3 · Design the Box</p>
          <p className="bottom-bar__title">{caption}</p>
        </div>
        <button className="bottom-bar__chev" onClick={onToggle}>{expanded ? '▼' : '▲'}</button>
      </div>
      <div className="bottom-bar__cta">
        <button className="btn" onClick={onNext} style={{ borderRadius: 0 }}>
          Next: Select Flavors
        </button>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [state, setState_]        = useState(S.get());
  const [summaryExp, setSummaryExp]  = useState(false);
  const [zoomStyleId, setZoomStyleId] = useState(null);
  const [storeOpen, setStoreOpen]    = useState(false);
  const [downsizeTarget, setDownsizeTarget] = useState(null);

  function update(partial) { setState_(S.set(partial)); }

  const currentStyle   = D.findStyle(state.boxStyleId);
  const isSingleSize   = currentStyle?.sizeIds.length === 1;
  const isSingleDesign = currentStyle?.designIds.length === 1;

  function selectStyle(styleId) {
    const st = D.findStyle(styleId);
    update({ boxStyleId: styleId, boxSizeId: st.sizeIds[0], boxDesignId: st.designIds[0] });
  }

  function selectSize(sizeId) {
    const newSize = D.findSize(sizeId);
    if (state.flavors.length > (newSize?.cap || 0)) {
      setDownsizeTarget(sizeId);
    } else {
      update({ boxSizeId: sizeId });
    }
  }

  const validDesignIds = currentStyle?.designIds || [];
  const visibleDesigns = D.designs.filter(d => validDesignIds.includes(d.id));
  const validSizeIds   = currentStyle?.sizeIds || [];
  const visibleSizes   = D.sizes.filter(s => validSizeIds.includes(s.id));
  const zoomSize       = isSingleSize
    ? D.findSize(currentStyle.sizeIds[0])
    : D.findSize(state.boxSizeId);

  return (
    <div className="app">
      <CMHeader />

      {/* Promo Banner */}
      {!state.promoDismissed && (
        <div className="promo">
          <div className="promo__icon">🎁</div>
          <div className="promo__body">
            <p className="promo__title">The New Square Box is Out!</p>
            <p className="promo__sub">Experiment with a fresh box design.</p>
          </div>
          <button className="promo__cta" onClick={() => selectStyle('square')}>
            Select Box <span>›</span>
          </button>
          <button className="promo__close" onClick={() => update({ promoDismissed: true })}>✕</button>
        </div>
      )}

      {/* Fulfillment */}
      <span className="section-label">How you'll get Custom Mix</span>
      <div className="fulfillment-wrap">
        <div className="seg">
          <button
            className="seg__opt"
            aria-pressed={state.fulfillment === 'shipping'}
            onClick={() => update({ fulfillment: 'shipping', storeId: null })}
          >
            🚚 Shipping
          </button>
          <button
            className="seg__opt"
            aria-pressed={state.fulfillment === 'pickup'}
            onClick={() => setStoreOpen(true)}
          >
            🏪 Pick Up in Store
          </button>
        </div>
        {state.fulfillment === 'pickup' && state.storeId && (
          <div className="pickup-info">
            📍 {D.stores.find(s => s.id === state.storeId)?.name}
            <button className="text-link" onClick={() => setStoreOpen(true)}>Change</button>
          </div>
        )}
      </div>

      {/* Box Style */}
      <span className="section-label">Select Box Style</span>
      <div className="tile-grid-3">
        {D.styles.map(st => (
          <button
            key={st.id}
            className="tile"
            aria-pressed={state.boxStyleId === st.id}
            onClick={() => selectStyle(st.id)}
          >
            <div
              className="tile__expand"
              onClick={e => { e.stopPropagation(); setZoomStyleId(st.id); }}
              role="button"
              aria-label={`Zoom ${st.name}`}
            >⌃⌄</div>
            <img className="tile__image" src={st.image} alt={st.name} />
            <div className="tile__body">
              <p className="tile__title">{st.name}</p>
            </div>
          </button>
        ))}
      </div>

      {/* Box Size */}
      <span className="section-label">Select Box Size</span>
      {isSingleSize ? (
        <div className="size-static">
          {D.findSize(currentStyle.sizeIds[0])?.label} &nbsp;·&nbsp; ${D.findSize(currentStyle.sizeIds[0])?.price.toFixed(2)}
        </div>
      ) : (
        <div className="tile-grid-3">
          {visibleSizes.map(sz => (
            <button
              key={sz.id}
              className={`tile size-tile${sz.id === state.boxSizeId ? '' : ''}`}
              aria-pressed={state.boxSizeId === sz.id}
              onClick={() => selectSize(sz.id)}
            >
              <div className="tile__body">
                <p className="tile__title">{sz.label}</p>
                <p className="tile__meta">${sz.price.toFixed(2)}</p>
                <p className="tile__cap">up to {sz.cap} flavors</p>
              </div>
            </button>
          ))}
        </div>
      )}

      {/* Box Design */}
      {!isSingleDesign && (
        <>
          <span className="section-label">Select Box Design</span>
          <div className="tile-grid-3">
            {visibleDesigns.map(d => (
              <button
                key={d.id}
                className="tile"
                aria-pressed={state.boxDesignId === d.id}
                onClick={() => update({ boxDesignId: d.id })}
              >
                <div
                  className="tile__expand"
                  onClick={e => { e.stopPropagation(); /* design zoom optional */ }}
                >⌃⌄</div>
                <img className="tile__image" src={d.image} alt={d.name} />
                <div className="tile__body">
                  <p className="tile__title">{d.name}</p>
                  <p className="tile__upcharge">{d.upcharge > 0 ? `+$${d.upcharge.toFixed(2)}` : 'Free'}</p>
                </div>
              </button>
            ))}
          </div>
        </>
      )}

      <div style={{ height: 'var(--s-40)' }} />

      {/* Summary bar */}
      <SummaryBar
        state={state}
        expanded={summaryExp}
        onToggle={() => setSummaryExp(e => !e)}
        onNext={() => window.location.href = '02-select-flavors.html'}
      />

      {/* Zoom modal */}
      {zoomStyleId && (
        <BoxZoomModal
          styleId={zoomStyleId}
          sizeId={zoomSize?.id || state.boxSizeId}
          onClose={() => setZoomStyleId(null)}
          onSelectAndContinue={() => {
            selectStyle(zoomStyleId);
            window.location.href = '02-select-flavors.html';
          }}
        />
      )}

      {/* Store picker */}
      {storeOpen && (
        <StorePickerModal
          onSelect={storeId => update({ fulfillment: 'pickup', storeId })}
          onClose={() => {
            if (!state.storeId) update({ fulfillment: 'shipping' });
            setStoreOpen(false);
          }}
        />
      )}

      {/* Downsize conflict */}
      {downsizeTarget && (
        <DownsizeModal
          targetSizeId={downsizeTarget}
          flavors={state.flavors}
          onSwitch={trimmed => { update({ boxSizeId: downsizeTarget, flavors: trimmed }); setDownsizeTarget(null); }}
          onCancel={() => setDownsizeTarget(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
